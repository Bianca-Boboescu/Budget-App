<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3d36">
<title>Buget</title>
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#16302a;--mut:#6b7d76;--line:#dde3de;--acc:#1f3d36;--hi:#e8f0ea;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--card:#1b2622;--ink:#e6eee9;--mut:#8ea39a;--line:#2b3a34;--acc:#7fc6a4;--hi:#23332c;--bad:#f2b8b5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:0}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
input,button,textarea{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--ink)}
input::placeholder{color:var(--mut);-webkit-text-fill-color:var(--mut)}
button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;cursor:pointer}
button.p{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
button.g{border:0;background:none;color:var(--mut);padding:4px 8px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
label{font-size:.85rem;color:var(--mut);display:block;margin:0 0 3px}
.sum{color:var(--mut);margin:10px 0}
.t{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.t b{display:block}.t small{color:var(--mut)}.amt{font-weight:700;white-space:nowrap}
.chip{display:inline-block;background:var(--hi);border-radius:99px;padding:1px 10px;font-size:.8rem;margin:2px 4px 0 0;cursor:pointer}
dialog{border:0;border-radius:14px;padding:18px;width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.it>div{flex:1}
.err{color:var(--bad);margin:8px 0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.login{max-width:340px;margin:12vh auto;padding:16px}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb = supabase.createClient('https://oprcrlgpshhhoqygmclu.supabase.co','sb_publishable_m-W7sBEkqru-CzZlgEj0lA_xcRC8oRY');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, c='RON') => Number(n).toLocaleString('ro-RO',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + c;
const dlg = $('#dlg');
let f = {q:'', from:'', to:'', m:''}, timer;

// ---------- LOGIN ----------
function loginView(msg=''){
  $('#app').innerHTML = `<div class="login"><h1>Buget</h1><p class="sum">Autentifică-te cu contul tău.</p>
  <div class="row"><input id="em" type="text" placeholder="Email" autocomplete="off" autocapitalize="off" spellcheck="false" style="background:#fff;color:#000;-webkit-text-fill-color:#000;caret-color:#000"></div>
  <div class="row"><input id="pw" type="text" placeholder="Parolă" autocomplete="off" autocapitalize="off" spellcheck="false" style="background:#fff;color:#000;-webkit-text-fill-color:#000;caret-color:#000"></div>
  <label style="margin-bottom:10px"><input id="sp" type="checkbox" style="width:auto"> Ascunde parola</label>
  <div class="err" id="lerr">${esc(msg)}</div><button class="p" id="go" style="width:100%">Intră</button></div>`;
  $('#sp').onchange = e => $('#pw').type = e.target.checked ? 'password' : 'text';
  const go = async () => {
    $('#lerr').textContent = 'Se verifică…';
    let error;
    try { ({error} = await sb.auth.signInWithPassword({email:$('#em').value.trim(), password:$('#pw').value})); }
    catch (e) { error = e; }
    if (error) $('#lerr').textContent = /invalid login/i.test(error.message)
      ? 'Email sau parolă greșită.'
      : 'Eroare: ' + error.message + ' (dacă e vorba de rețea, deschide aplicația din GitHub Pages sau din fișier, nu din previzualizarea din chat)';
  };
  $('#go').onclick = go; $('#pw').onkeydown = e => e.key==='Enter' && go();
}

// ---------- LISTĂ + CĂUTARE ----------
function mainView(){
  $('#app').innerHTML = `<header><h1>Bonuri</h1><div><button class="p" id="add">+ Adaugă</button> <button class="g" id="out">Ieși</button></div></header>
  <div class="row"><input id="q" type="search" placeholder="Caută: cafea, orez, Lidl…" value="${esc(f.q)}"></div>
  <div class="row"><div><label>De la</label><input id="from" type="date" value="${f.from}"></div>
  <div><label>Până la</label><input id="to" type="date" value="${f.to}"></div>
  <div><label>Magazin</label><input id="m" placeholder="ex: Lidl" value="${esc(f.m)}"></div></div>
  <div class="sum" id="sum"></div><div id="list"></div>`;
  $('#out').onclick = () => sb.auth.signOut();
  $('#add').onclick = () => editView();
  for (const [id,k] of [['q','q'],['from','from'],['to','to'],['m','m']])
    $('#'+id).oninput = e => { f[k] = e.target.value; clearTimeout(timer); timer = setTimeout(load, 250); };
  load();
}

async function load(){
  const {data, error} = await sb.rpc('search_transactions',{
    q: f.q||null, date_from: f.from||null, date_to: f.to||null, merchant_q: f.m||null});
  if (!$('#list')) return;
  if (error) { $('#list').innerHTML = `<div class="err">${esc(error.message)}</div>`; return; }
  const total = data.reduce((s,t)=>s+Number(t.total),0);
  $('#sum').textContent = data.length ? `${data.length} bonuri · total ${money(total)}` : '';
  $('#list').innerHTML = data.length ? data.map(t => `<div class="t" data-id="${t.id}">
    <div><b>${esc(t.merchant||'Fără magazin')}</b><small>${new Date(t.date).toLocaleDateString('ro-RO')}${t.notes?' · '+esc(t.notes):''}</small></div>
    <div class="amt">${money(t.total,t.currency)}</div></div>`).join('')
    : `<div class="empty">Niciun bon găsit. Apasă „Adaugă" ca să creezi primul.</div>`;
  document.querySelectorAll('.t').forEach(el => el.onclick = () => detailView(el.dataset.id));
}

// ---------- DETALII BON ----------
async function detailView(id){
  const {data:t} = await sb.from('transactions').select('*, receipt_items(*)').eq('id',id).single();
  if (!t) return;
  const items = t.receipt_items || [];
  dlg.innerHTML = `<h2 style="margin-top:0">${esc(t.merchant||'Fără magazin')}</h2>
  <p class="sum">${new Date(t.date).toLocaleDateString('ro-RO')} · <b>${money(t.total,t.currency)}</b>${t.notes?'<br>'+esc(t.notes):''}</p>
  ${items.length ? items.map(i => `<div class="it"><div>${esc(i.name)} <small style="color:var(--mut)">${i.price!=null?money(i.price,''):''}</small><br>
    ${(i.tags||[]).map(g=>`<span class="chip" data-rm="${i.id}" data-tag="${esc(g)}" title="Apasă pentru a șterge">${esc(g)} ×</span>`).join('')}</div>
    <button data-tag-item="${i.id}" data-name="${esc(i.name)}">Etichetează</button></div>`).join('')
    : '<div class="empty">Fără produse pe acest bon.</div>'}
  <div class="row" style="margin-top:14px"><button id="del" style="color:var(--bad)">Șterge bon</button><button class="p" id="cl">Închide</button></div>`;
  dlg.showModal();
  $('#cl').onclick = () => dlg.close();
  $('#del').onclick = async () => { if (confirm('Ștergi bonul?')) { await sb.from('transactions').delete().eq('id',id); dlg.close(); load(); } };
  dlg.querySelectorAll('[data-tag-item]').forEach(b => b.onclick = () => tagItem(b.dataset.tagItem, b.dataset.name, id));
  dlg.querySelectorAll('[data-rm]').forEach(c => c.onclick = async () => {
    const it = items.find(x=>x.id===c.dataset.rm);
    await sb.from('receipt_items').update({tags: it.tags.filter(g=>g!==c.dataset.tag)}).eq('id',it.id);
    detailView(id);
  });
}

async function tagItem(itemId, name, txId){
  const label = (prompt(`Etichetă pentru „${name}" (ex: cafea):`)||'').trim().toLowerCase();
  if (!label) return;
  if (confirm(`Ține minte pentru viitor?\nOrice produs care conține textul de mai jos va primi eticheta „${label}" (și bonurile vechi).`)) {
    const match = (prompt('Text de potrivire (îl poți scurta):', name.toLowerCase())||'').trim();
    if (match) await sb.from('product_aliases').insert({match_text:match, label});
  }
  const {data:it} = await sb.from('receipt_items').select('tags').eq('id',itemId).single();
  const tags = [...new Set([...(it?.tags||[]), label])];
  await sb.from('receipt_items').update({tags}).eq('id',itemId);
  detailView(txId);
}

// ---------- ADAUGĂ BON ----------
function editView(){
  const today = new Date().toISOString().slice(0,10);
  dlg.innerHTML = `<h2 style="margin-top:0">Bon nou</h2>
  <div class="row"><div><label>Data</label><input id="d" type="date" value="${today}"></div>
  <div><label>Magazin</label><input id="mc"></div></div>
  <div class="row"><div><label>Total</label><input id="tt" type="number" step="0.01" inputmode="decimal"></div>
  <div><label>Monedă</label><input id="cur" value="RON"></div></div>
  <div class="row"><div><label>Notițe</label><input id="nt"></div></div>
  <label>Produse (opțional)</label><div id="its"></div>
  <button id="ai" style="margin:6px 0 12px">+ Produs</button>
  <div class="err" id="er"></div>
  <div class="row"><button id="cl">Anulează</button><button class="p" id="sv">Salvează</button></div>`;
  const addRow = () => { const r = document.createElement('div'); r.className='row';
    r.innerHTML = '<input class="n" placeholder="Produs"><input class="p" type="number" step="0.01" inputmode="decimal" placeholder="Preț" style="max-width:110px">';
    $('#its').appendChild(r); };
  addRow(); $('#ai').onclick = addRow; $('#cl').onclick = () => dlg.close();
  dlg.showModal();
  $('#sv').onclick = async () => {
    const total = parseFloat($('#tt').value);
    if (isNaN(total)) { $('#er').textContent = 'Introdu totalul bonului.'; return; }
    const {data:t, error} = await sb.from('transactions').insert({
      date:$('#d').value, merchant:$('#mc').value.trim()||null, total, currency:$('#cur').value.trim()||'RON', notes:$('#nt').value.trim()||null}).select().single();
    if (error) { $('#er').textContent = error.message; return; }
    const items = [...$('#its').children].map(r => ({transaction_id:t.id, name:r.querySelector('.n').value.trim(),
      price:r.querySelector('.p').value===''?null:parseFloat(r.querySelector('.p').value)})).filter(i=>i.name);
    if (items.length) await sb.from('receipt_items').insert(items);
    dlg.close(); load();
  };
}

// ---------- PORNIRE + SINCRONIZARE ----------
sb.auth.onAuthStateChange((_e, session) => session ? mainView() : loginView());
sb.channel('sync').on('postgres_changes',{event:'*',schema:'public'}, () => { if (!dlg.open) load(); }).subscribe();
</script>
</body>
</html>
